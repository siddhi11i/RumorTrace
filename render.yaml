services:
  - type: web
    name: rumortrace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HF_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://YOUR_GITHUB_USERNAME.github.io
      - key: FLASK_ENV
        value: production
